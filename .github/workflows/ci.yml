name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 22.18+ ejecuta .ts sin flags
      - name: Validar JSON
        run: |
          for f in .claude-plugin/marketplace.json mods/modslimit-router/.claude-plugin/plugin.json mods/modslimit-router/hooks/hooks.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f"
          done
      - name: Clasificador contra los fixtures
        run: node --test tests/test_classify_ts.mjs
